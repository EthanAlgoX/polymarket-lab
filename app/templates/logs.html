{% extends "base.html" %}
{% block title %}<span data-i18n-en="Data connection logs" data-i18n-zh="数据链路日志">Data connection logs</span>{% endblock %}
{% block content %}
<div class="toolbar"><p class="page-context"><span data-i18n-en="Inspect collection, refresh, and connection errors. Shows the latest 100 events and refreshes every 5 seconds." data-i18n-zh="检查采集、刷新和连接异常。显示最近 100 条事件，每 5 秒刷新。">Inspect collection, refresh, and connection errors. Shows the latest 100 events and refreshes every 5 seconds.</span></p><div class="toolbar-actions"><label class="log-filter"><span data-i18n-en="Event level" data-i18n-zh="事件级别">Event level</span><select id="log-level"><option value=""><span data-i18n-en="All levels" data-i18n-zh="全部级别">All levels</span></option><option>INFO</option><option>WARNING</option><option>ERROR</option></select></label><button id="refresh" class="button"><span data-i18n-en="Refresh logs" data-i18n-zh="刷新日志">Refresh logs</span></button></div></div>
<section class="panel table-panel"><div class="table-wrap"><table><thead><tr><th><span data-i18n-en="Time" data-i18n-zh="发生时间">Time</span></th><th><span data-i18n-en="Level" data-i18n-zh="级别">Level</span></th><th><span data-i18n-en="Component" data-i18n-zh="链路">Component</span></th><th><span data-i18n-en="Event" data-i18n-zh="事件">Event</span></th><th><span data-i18n-en="Details" data-i18n-zh="详情">Details</span></th></tr></thead><tbody id="log-table"><tr><td colspan="5" class="empty"><span data-i18n-en="Loading runtime logs…" data-i18n-zh="正在读取运行日志…">Loading runtime logs…</span></td></tr></tbody></table></div></section>
{% endblock %}
