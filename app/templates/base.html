<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="/static/favicon.svg">
  <title>盘口工作区 · Polymarket 研究台</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/market-language.css">
  <link rel="stylesheet" href="/static/css/site-shell.css">
  <script src="/static/js/market-language.js" defer></script>
  <script src="/static/js/site-navigation.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body data-page="{{ page }}"{% if market_id %} data-market-id="{{ market_id }}"{% endif %}>
  {% include "sidebar.html" %}
  <main class="site-content">
    <header class="page-header">
      <div><p class="eyebrow">盘口工作区</p><h1>{% block title %}{% endblock %}</h1></div>
      <div class="page-header-tools">{% include "language_controls.html" %}<div id="clock" class="clock"></div></div>
    </header>
    <div id="error" class="error hidden" role="alert"></div>
    {% block content %}{% endblock %}
    <footer class="workspace-footer">
      <p>盘口结果为快照估算；双腿成交独立，合并与链上成本需要另行核验。此工具不提交订单。</p>
      <p>前端与研究功能由本项目改造；采集和扫描底座来自 <a href="https://github.com/0106ss/polymarket-market-scanner" target="_blank" rel="noopener">Polymarket Market Scanner</a>，保留 MIT 许可与原作者声明。</p>
    </footer>
  </main>
</body>
</html>
