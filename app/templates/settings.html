{% extends "base.html" %}
{% block title %}盘口扫描参数{% endblock %}
{% block content %}
<div class="settings-layout"><section class="settings-description"><h2>候选门槛</h2><p>参数决定哪些快照进入候选列表。收益率以双腿买入金额、费用、缓冲和其他成本的总预算为分母。</p><h2>成本假设</h2><p>滑点与安全缓冲用于估算价格变化带来的影响。市场详情中的其他成本可单独调整；这些假设没有替代实际成交和合并成本。</p></section>
<section class="panel settings-panel"><form id="settings-form"><div class="form-grid"><label>最低估算净差额 / pUSD<input name="minimum_net_profit" type="number" step="0.01" min="0" required></label><label>最低预算收益率 / 小数<input name="minimum_net_roi" type="number" step="0.001" min="0" max="1" required></label><label>每腿目标股数<input name="default_quantity" type="number" step="1" min="0.000001" required></label><label>滑点缓冲率 / 小数<input name="slippage_rate" type="number" step="0.001" min="0" max="0.25" required></label><label>安全缓冲率 / 小数<input name="safety_rate" type="number" step="0.001" min="0" max="0.25" required></label></div><div class="form-actions"><button class="button" type="submit">保存扫描参数</button><span id="settings-result" role="status"></span></div></form></section></div>
{% endblock %}
