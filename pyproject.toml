[project]
name = "polymarket-lab"
version = "0.1.0"
description = "Read-only Polymarket public orderbook scanner with depth-aware paper analysis."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "websockets>=15,<18",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "tenacity>=9,<10",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: public-network smoke tests excluded from default CI"]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
